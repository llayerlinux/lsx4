plugins {
    id "com.android.application"
}

def resolvedApplicationId = providers.gradleProperty("applicationIdOverride")
        .orElse("app.lsx4.android")

android {
    namespace "app.lsx4.android"
    compileSdk 35

    defaultConfig {
        applicationId resolvedApplicationId.get()
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
